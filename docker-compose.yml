services:
  db:
    image: postgres:16-alpine
    container_name: betpredict-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betpredict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betpredict_secret}
      POSTGRES_DB: ${POSTGRES_DB:-betpredict}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betpredict}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: betpredict-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: betpredict-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-betpredict}:${POSTGRES_PASSWORD:-betpredict_secret}@db:5432/${POSTGRES_DB:-betpredict}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-betpredict}:${POSTGRES_PASSWORD:-betpredict_secret}@db:5432/${POSTGRES_DB:-betpredict}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DEMO_MODE: ${DEMO_MODE:-true}
      PRIMARY_DATA_PROVIDER: ${PRIMARY_DATA_PROVIDER:-demo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: betpredict-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-betpredict}:${POSTGRES_PASSWORD:-betpredict_secret}@db:5432/${POSTGRES_DB:-betpredict}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-betpredict}:${POSTGRES_PASSWORD:-betpredict_secret}@db:5432/${POSTGRES_DB:-betpredict}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app.celery worker --beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: betpredict-frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
